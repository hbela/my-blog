<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="990" fill="#0d1117"/>
  <rect width="1400" height="990" fill="url(#glow)"/>
  <rect width="1400" height="990" fill="url(#glow2)"/>

  <g transform="translate(0,48)">

  <!-- header -->
  <rect x="96" y="96" width="120" height="4" rx="2" fill="url(#rule)"/>

  <text x="96" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3">The right tunnel, the wrong database</text>
  <text x="96" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#8b949e">pgAdmin, Docker and PostgreSQL over SSH</text>

  <!-- terminal -->
  <g filter="url(#soft)">
    <rect x="96" y="322" width="1208" height="474" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
    <path d="M96 340 a18 18 0 0 1 18 -18 h1172 a18 18 0 0 1 18 18 v34 h-1208 z" fill="#21262d"/>
    <line x1="96" y1="374" x2="1304" y2="374" stroke="#3d444d" stroke-width="1.5"/>
    <circle cx="128" cy="348" r="7" fill="#f85149"/>
    <circle cx="154" cy="348" r="7" fill="#d29922"/>
    <circle cx="180" cy="348" r="7" fill="#3fb950"/>
    <text x="652" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#6e7681">docker ps &#8212; on the VPS</text>
  </g>

  <!-- command -->
  <text x="140" y="432" font-family="Consolas, monospace" font-size="27" fill="#6366f1">$</text>
  <text x="172" y="432" font-family="Consolas, monospace" font-size="27" fill="#e6edf3">docker ps --format '{{.Names}}\t{{.Ports}}'</text>

  <!-- rows -->
  <g font-family="Consolas, monospace" font-size="26">
    <text x="172" y="504" fill="#8b949e">postgres-a1b2c3</text>
    <text x="640" y="504" fill="#f85149">0.0.0.0:5432-&gt;5432/tcp</text>
    <text x="1060" y="504" fill="#6e7681">published</text>

    <text x="172" y="556" fill="#8b949e">postgres-d4e5f6</text>
    <text x="640" y="556" fill="#6e7681">5432/tcp</text>
    <text x="1060" y="556" fill="#6e7681">internal</text>

    <rect x="140" y="580" width="1124" height="46" rx="8" fill="#3fb950" fill-opacity="0.10"/>
    <rect x="140" y="580" width="4" height="46" rx="2" fill="#3fb950"/>
    <text x="172" y="612" fill="#f0f6fc">postgres-g7h8i9</text>
    <text x="640" y="612" fill="#8b949e">5432/tcp</text>
    <text x="1060" y="612" fill="#3fb950">&lt;-- mine</text>

    <text x="172" y="668" fill="#8b949e">postgres-j1k2l3</text>
    <text x="640" y="668" fill="#6e7681">5432/tcp</text>
    <text x="1060" y="668" fill="#6e7681">internal</text>
  </g>

  <line x1="140" y1="702" x2="1264" y2="702" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g font-family="Consolas, monospace" font-size="25">
    <text x="172" y="748" fill="#6e7681">connected to</text>
    <text x="420" y="748" fill="#f85149">postgres-a1b2c3</text>
    <text x="820" y="748" fill="#6e7681">3 databases, 0 tables</text>
  </g>

  <text x="96" y="852" font-family="Consolas, monospace" font-size="24" fill="#484f58">the lesson:</text>
  <text x="252" y="852" font-family="Consolas, monospace" font-size="24" fill="#8b949e">connecting to PostgreSQL is not connecting to the right one</text>

  </g>
</svg>
