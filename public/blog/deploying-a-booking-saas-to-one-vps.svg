<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#3fb950" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="990" fill="#0d1117"/>
  <rect width="1400" height="990" fill="url(#glow)"/>
  <rect width="1400" height="990" fill="url(#glow2)"/>

  <g transform="translate(0,48)">

    <!-- header -->
    <rect x="96" y="96" width="120" height="4" rx="2" fill="url(#rule)"/>

    <text x="96" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" fill="#e6edf3">Deploying a booking SaaS</text>
    <text x="96" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#8b949e">One VPS, Coolify, and the eight things that broke</text>

    <!-- terminal -->
    <g filter="url(#soft)">
      <rect x="96" y="322" width="1208" height="474" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
      <path d="M96 340 a18 18 0 0 1 18 -18 h1172 a18 18 0 0 1 18 18 v34 h-1208 z" fill="#21262d"/>
      <line x1="96" y1="374" x2="1304" y2="374" stroke="#3d444d" stroke-width="1.5"/>
      <circle cx="128" cy="348" r="7" fill="#f85149"/>
      <circle cx="154" cy="348" r="7" fill="#d29922"/>
      <circle cx="180" cy="348" r="7" fill="#3fb950"/>
      <text x="652" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#6e7681">deploy &#8212; booking-and-more @ hetzner</text>
    </g>

    <!-- command -->
    <text x="140" y="432" font-family="Consolas, monospace" font-size="27" fill="#3fb950">$</text>
    <text x="172" y="432" font-family="Consolas, monospace" font-size="27" fill="#e6edf3">git push origin main</text>

    <!-- rows -->
    <g font-family="Consolas, monospace" font-size="26">
      <text x="172" y="500" fill="#8b949e">postgres</text>
      <text x="470" y="500" fill="#3fb950">healthy</text>
      <text x="720" y="500" fill="#6e7681">no host port</text>

      <text x="172" y="546" fill="#8b949e">redis</text>
      <text x="470" y="546" fill="#3fb950">healthy</text>
      <text x="720" y="546" fill="#6e7681">requirepass</text>

      <text x="172" y="592" fill="#8b949e">migrate</text>
      <text x="470" y="592" fill="#3fb950">exit 0</text>
      <text x="720" y="592" fill="#6e7681">gates api + worker</text>

      <text x="172" y="638" fill="#8b949e">api</text>
      <text x="470" y="638" fill="#3fb950">healthy</text>
      <text x="720" y="638" fill="#6e7681">api.example.com</text>

      <text x="172" y="684" fill="#8b949e">worker</text>
      <text x="470" y="684" fill="#3fb950">healthy</text>
      <text x="720" y="684" fill="#6e7681">no domain, by design</text>

      <text x="172" y="730" fill="#8b949e">web</text>
      <text x="470" y="730" fill="#3fb950">healthy</text>
      <text x="720" y="730" fill="#6e7681">app.example.com</text>
    </g>

    <text x="96" y="852" font-family="Consolas, monospace" font-size="24" fill="#484f58">the customer installs:</text>
    <text x="430" y="852" font-family="Consolas, monospace" font-size="24" fill="#8b949e">nothing. they open a link.</text>

  </g>
</svg>
