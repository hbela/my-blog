<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="990" fill="#0d1117"/>
  <rect width="1400" height="990" fill="url(#glow)"/>
  <rect width="1400" height="990" fill="url(#glow2)"/>

  <g transform="translate(0,48)">

  <!-- header -->
  <rect x="96" y="96" width="120" height="4" rx="2" fill="url(#rule)"/>

  <text x="96" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3">Hardening a Hetzner VPS</text>
  <text x="96" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#8b949e">SSH keys, a cloud firewall, and four traps</text>

  <!-- terminal -->
  <g filter="url(#soft)">
    <rect x="96" y="322" width="1208" height="474" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
    <path d="M96 340 a18 18 0 0 1 18 -18 h1172 a18 18 0 0 1 18 18 v34 h-1208 z" fill="#21262d"/>
    <line x1="96" y1="374" x2="1304" y2="374" stroke="#3d444d" stroke-width="1.5"/>
    <circle cx="128" cy="348" r="7" fill="#f85149"/>
    <circle cx="154" cy="348" r="7" fill="#d29922"/>
    <circle cx="180" cy="348" r="7" fill="#3fb950"/>
    <text x="652" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#6e7681">external scan &#8212; from my laptop</text>
  </g>

  <!-- command -->
  <text x="140" y="432" font-family="Consolas, monospace" font-size="27" fill="#6366f1">$</text>
  <text x="172" y="432" font-family="Consolas, monospace" font-size="27" fill="#e6edf3">nmap -Pn -p 22,80,443,5432,6379,8000 SERVER_IP</text>

  <!-- rows -->
  <g font-family="Consolas, monospace" font-size="27">
    <text x="172" y="502" fill="#8b949e">22/tcp</text>
    <text x="420" y="502" fill="#3fb950">open</text>
    <text x="620" y="502" fill="#6e7681">ssh</text>

    <text x="172" y="550" fill="#8b949e">80/tcp</text>
    <text x="420" y="550" fill="#3fb950">open</text>
    <text x="620" y="550" fill="#6e7681">http</text>

    <text x="172" y="598" fill="#8b949e">443/tcp</text>
    <text x="420" y="598" fill="#3fb950">open</text>
    <text x="620" y="598" fill="#6e7681">https</text>

    <rect x="140" y="622" width="1124" height="44" rx="8" fill="#f85149" fill-opacity="0.10"/>
    <rect x="140" y="622" width="4" height="44" rx="2" fill="#f85149"/>
    <text x="172" y="653" fill="#f0f6fc">5432/tcp</text>
    <text x="420" y="653" fill="#f85149" font-weight="700">open</text>
    <text x="620" y="653" fill="#f85149">postgresql</text>
    <text x="900" y="653" fill="#f85149">&lt;-- exposed</text>

    <text x="172" y="705" fill="#8b949e">6379/tcp</text>
    <text x="420" y="705" fill="#6e7681">filtered</text>
    <text x="620" y="705" fill="#6e7681">redis</text>

    <rect x="140" y="729" width="1124" height="44" rx="8" fill="#f85149" fill-opacity="0.10"/>
    <rect x="140" y="729" width="4" height="44" rx="2" fill="#f85149"/>
    <text x="172" y="760" fill="#f0f6fc">8000/tcp</text>
    <text x="420" y="760" fill="#f85149" font-weight="700">open</text>
    <text x="620" y="760" fill="#f85149">coolify</text>
    <text x="900" y="760" fill="#f85149">&lt;-- exposed</text>
  </g>

  <text x="96" y="852" font-family="Consolas, monospace" font-size="24" fill="#484f58">the fix:</text>
  <text x="210" y="852" font-family="Consolas, monospace" font-size="24" fill="#8b949e">22, 80, 443 &#8212; everything else blocked at the cloud firewall</text>

  </g>
</svg>
